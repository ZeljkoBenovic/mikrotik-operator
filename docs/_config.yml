title: MikroTik Kubernetes Operator
description: Manage MikroTik RouterOS configuration from Kubernetes.
url: https://zeljkobenovic.github.io
baseurl: /mikrotik-operator
lang: en-US
theme: jekyll-vitepress-theme
markdown: kramdown
highlighter: rouge

plugins:
  - jekyll-vitepress-theme
  - jekyll-redirect-from

exclude:
  - Gemfile
  - Gemfile.lock
  - vendor
  - superpowers
  - .bundle
  - .jekyll-cache
  - .ruby-version

collections:
  guide:
    output: true
    permalink: /:name/
  reference:
    output: true
    permalink: /:name/

defaults:
  - scope:
      path: ""
    values:
      layout: default
      jekyll_vitepress:
        auto_title: false
  - scope:
      path: ""
      type: guide
    values:
      layout: default
      jekyll_vitepress:
        auto_title: false
  - scope:
      path: ""
      type: reference
    values:
      layout: default
      jekyll_vitepress:
        auto_title: false

jekyll_vitepress:
  branding:
    site_title: MikroTik Kubernetes Operator
  typography:
    google_fonts_url: false
  syntax:
    light_theme: github
    dark_theme: github.dark
  tokens:
    light:
      --vp-c-brand-1: "#0e7490"
      --vp-c-brand-2: "#155e75"
      --vp-c-brand-3: "#164e63"
    dark:
      --vp-c-brand-1: "#22d3ee"
      --vp-c-brand-2: "#67e8f9"
      --vp-c-brand-3: "#06b6d4"
      --vp-c-bg: "#0a192f"
      --vp-c-bg-alt: "#060d19"
      --vp-c-bg-elv: "#0f2744"
      --vp-c-bg-soft: "#0f2744"
  seo:
    page_type: WebPage
    title_template: ":page | :site"
    image:
      path: /images/mikrotik-operator-banner.png
      alt: Kubernetes Operator for MikroTik Routers
      width: 1200
      height: 630
    publisher:
      type: Organization
      name: MikroTik Kubernetes Operator
      url: https://github.com/ZeljkoBenovic/mikrotik-operator
      same_as:
        - https://github.com/ZeljkoBenovic/mikrotik-operator
  footer:
    enabled: true
    message: Manage MikroTik RouterOS configuration from Kubernetes.
    copyright: © ZeljkoBenovic
    show_on_docs: false
  doc_footer:
    enabled: true
  edit_link:
    enabled: true
    pattern: "https://github.com/ZeljkoBenovic/mikrotik-operator/edit/main/docs/:path"
    text: Edit this page on GitHub
  last_updated:
    enabled: true
    text: Last updated
    format: vitepress
  github_star:
    enabled: false
  github_sponsor:
    enabled: false
  gem_downloads:
    enabled: false
