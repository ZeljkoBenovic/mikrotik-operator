apiVersion: v1
kind: Namespace
metadata:
  name: e2e-test
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: e2e-test
spec:
  replicas: 2
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
      - name: web
        image: nginx:1.27-alpine
        ports:
        - name: http
          containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: e2e-test
spec:
  selector:
    app: web
  ports:
  - name: http
    port: 80
    targetPort: http
  type: ClusterIP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: web
  namespace: e2e-test
  annotations:
    mikrotik.operator.io/public-ip: 192.168.100.254
spec:
  ingressClassName: mikrotik
  rules:
  - host: web.e2e.home.arpa
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: web
            port:
              number: 80
