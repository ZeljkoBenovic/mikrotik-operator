apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: mikrotik-operator
rules:
- apiGroups: [mikrotik.operator.io]
  resources: [mikrotikrouters, mikrotikdnsrecords, mikrotikportforwards, mikrotikroutes, mikrotikfirewallrules, mikrotikbackups, mikrotikrestores]
  verbs: [get, list, watch, create, update, patch, delete]
- apiGroups: [mikrotik.operator.io]
  resources: [mikrotikrouters/status, mikrotikdnsrecords/status, mikrotikportforwards/status, mikrotikroutes/status, mikrotikfirewallrules/status, mikrotikbackups/status, mikrotikrestores/status]
  verbs: [get, update, patch]
- apiGroups: [""]
  resources: [secrets, pods, nodes]
  verbs: [get, list, watch]
- apiGroups: [""]
  resources: [services]
  verbs: [get, list, watch, update]
- apiGroups: [""]
  resources: [namespaces]
  verbs: [get, list, watch]
- apiGroups: [networking.k8s.io]
  resources: [ingresses, ingressclasses]
  verbs: [get, list, watch]
- apiGroups: [gateway.networking.k8s.io]
  resources: [httproutes, gateways, gatewayclasses, referencegrants]
  verbs: [get, list, watch]
- apiGroups: [""]
  resources: [events]
  verbs: [create, patch]
- apiGroups: [coordination.k8s.io]
  resources: [leases]
  verbs: [get, list, watch, create, update, patch]
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: mikrotik-operator
  namespace: mikrotik-operator-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: mikrotik-operator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: mikrotik-operator
subjects:
- kind: ServiceAccount
  name: mikrotik-operator
  namespace: mikrotik-operator-system
