apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: mikrotikdnsrecords.mikrotik.operator.io
spec:
  group: mikrotik.operator.io
  names:
    kind: MikroTikDNSRecord
    listKind: MikroTikDNSRecordList
    plural: mikrotikdnsrecords
    singular: mikrotikdnsrecord
    shortNames:
    - mtdns
  scope: Namespaced
  versions:
  - name: v1alpha1
    served: true
    storage: true
    additionalPrinterColumns:
    - name: Address
      type: string
      jsonPath: .spec.address
    - name: Ready
      type: string
      jsonPath: .status.conditions[?(@.type=="Ready")].status
    - name: Age
      type: date
      jsonPath: .metadata.creationTimestamp
    schema:
      openAPIV3Schema:
        type: object
        required: [spec]
        properties:
          spec:
            type: object
            required: [name, address]
            properties:
              routerRef:
                type: string
              name:
                type: string
                minLength: 1
              address:
                type: string
                minLength: 1
              ttl:
                type: string
              serviceRef:
                type: object
                properties:
                  namespace:
                    type: string
                  name:
                    type: string
          status:
            type: object
            properties:
              applied:
                type: boolean
              routerID:
                type: string
              routerRef:
                type: string
              conditions:
                type: array
                items:
                  type: object
                  required: [lastTransitionTime, message, reason, status, type]
                  properties:
                    lastTransitionTime:
                      type: string
                      format: date-time
                    message:
                      type: string
                    observedGeneration:
                      type: integer
                      format: int64
                      minimum: 0
                    reason:
                      type: string
                      minLength: 1
                    status:
                      type: string
                      enum: ["True", "False", "Unknown"]
                    type:
                      type: string
                      minLength: 1
    subresources:
      status: {}
