apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: mikrotikbackups.mikrotik.operator.io
spec:
  group: mikrotik.operator.io
  names:
    kind: MikroTikBackup
    listKind: MikroTikBackupList
    plural: mikrotikbackups
    singular: mikrotikbackup
    shortNames:
    - mtbackup
  scope: Namespaced
  versions:
  - name: v1alpha1
    served: true
    storage: true
    additionalPrinterColumns:
    - name: Router
      type: string
      jsonPath: .spec.routerRef
    - name: Role
      type: string
      jsonPath: .status.role
    - name: Bytes
      type: integer
      jsonPath: .status.exportBytes
    - name: Ready
      type: string
      jsonPath: .status.conditions[?(@.type=="Ready")].status
    - name: Age
      type: date
      jsonPath: .metadata.creationTimestamp
    schema:
      openAPIV3Schema:
        type: object
        required: [spec]
        properties:
          spec:
            type: object
            required: [routerRef]
            x-kubernetes-validations:
            - rule: "!has(self.remote) || !has(self.remote.enabled) || self.remote.enabled == false"
              message: "remote backup storage is not implemented; spec.remote.enabled must be false"
            properties:
              routerRef:
                type: string
                minLength: 1
              schedule:
                type: string
                description: Standard five-field cron expression. Empty takes one snapshot.
              retention:
                type: integer
                format: int32
                minimum: 1
                maximum: 100
                description: Owned snapshot count to keep for scheduled backups. Defaults to 5.
              remote:
                type: object
                description: Reserved future FTP/SMB/S3 storage. Must remain disabled.
                properties:
                  enabled:
                    type: boolean
                  ftp:
                    type: object
                    properties:
                      address:
                        type: string
                      path:
                        type: string
                      credentialsSecret:
                        type: object
                        properties:
                          name:
                            type: string
                  smb:
                    type: object
                    properties:
                      share:
                        type: string
                      path:
                        type: string
                      credentialsSecret:
                        type: object
                        properties:
                          name:
                            type: string
                  s3:
                    type: object
                    properties:
                      bucket:
                        type: string
                      prefix:
                        type: string
                      endpoint:
                        type: string
                      region:
                        type: string
                      credentialsSecret:
                        type: object
                        properties:
                          name:
                            type: string
          status:
            type: object
            properties:
              role:
                type: string
              routerRef:
                type: string
              export:
                type: string
                maxLength: 1048576
              exportBytes:
                type: integer
                format: int64
                minimum: 0
              exportWarning:
                type: string
              capturedAt:
                type: string
                format: date-time
              lastScheduleTime:
                type: string
                format: date-time
              nextScheduleTime:
                type: string
                format: date-time
              snapshotCount:
                type: integer
                format: int32
              observedGeneration:
                type: integer
                format: int64
                minimum: 0
              conditions:
                type: array
                items:
                  type: object
                  required: [lastTransitionTime, message, reason, status, type]
                  properties:
                    lastTransitionTime:
                      type: string
                      format: date-time
                    message:
                      type: string
                    observedGeneration:
                      type: integer
                      format: int64
                      minimum: 0
                    reason:
                      type: string
                      minLength: 1
                    status:
                      type: string
                      enum: ["True", "False", "Unknown"]
                    type:
                      type: string
                      minLength: 1
    subresources:
      status: {}
