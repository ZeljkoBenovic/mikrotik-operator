apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: mikrotikrestores.mikrotik.operator.io
spec:
  group: mikrotik.operator.io
  names:
    kind: MikroTikRestore
    listKind: MikroTikRestoreList
    plural: mikrotikrestores
    singular: mikrotikrestore
    shortNames:
    - mtrestore
  scope: Namespaced
  versions:
  - name: v1alpha1
    served: true
    storage: true
    additionalPrinterColumns:
    - name: Backup
      type: string
      jsonPath: .spec.backupRef.name
    - name: Target
      type: string
      jsonPath: .status.target
    - name: Ready
      type: string
      jsonPath: .status.conditions[?(@.type=="Ready")].status
    - name: Age
      type: date
      jsonPath: .metadata.creationTimestamp
    schema:
      openAPIV3Schema:
        type: object
        required: [spec]
        properties:
          spec:
            type: object
            required: [backupRef]
            x-kubernetes-validations:
            - rule: >-
                (has(self.routerRef) && size(self.routerRef) > 0) !=
                (has(self.connection) && has(self.connection.address) &&
                size(self.connection.address) > 0 &&
                has(self.connection.credentialsSecret) &&
                size(self.connection.credentialsSecret.name) > 0)
              message: spec must set exactly one of routerRef or connection.address with credentialsSecret
            properties:
              backupRef:
                type: object
                required: [name]
                properties:
                  namespace:
                    type: string
                  name:
                    type: string
                    minLength: 1
              routerRef:
                type: string
              connection:
                type: object
                required: [address, credentialsSecret]
                properties:
                  address:
                    type: string
                    minLength: 1
                  port:
                    type: integer
                    format: int32
                  tls:
                    type: boolean
                  credentialsSecret:
                    type: object
                    required: [name]
                    properties:
                      name:
                        type: string
                        minLength: 1
              confirm:
                type: string
                description: Must equal RESTORE before the operator runs /import.
          status:
            type: object
            properties:
              applied:
                type: boolean
              appliedAt:
                type: string
                format: date-time
              backupUID:
                type: string
              target:
                type: string
              observedGeneration:
                type: integer
                format: int64
                minimum: 0
              conditions:
                type: array
                items:
                  type: object
                  required: [lastTransitionTime, message, reason, status, type]
                  properties:
                    lastTransitionTime:
                      type: string
                      format: date-time
                    message:
                      type: string
                    observedGeneration:
                      type: integer
                      format: int64
                      minimum: 0
                    reason:
                      type: string
                      minLength: 1
                    status:
                      type: string
                      enum: ["True", "False", "Unknown"]
                    type:
                      type: string
                      minLength: 1
    subresources:
      status: {}
