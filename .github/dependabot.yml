version: 2

updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "04:00"
    open-pull-requests-limit: 10
    groups:
      go-dependencies:
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "04:15"
    open-pull-requests-limit: 10
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: npm
    directory: /web/ui
    schedule:
      interval: weekly
      day: monday
      time: "04:45"
    open-pull-requests-limit: 10
    ignore:
      # typescript-eslint still requires typescript <6.1.0; TS 7 has no
      # programmatic API for the linter yet.
      - dependency-name: "typescript"
        versions: [">=7"]
    groups:
      ui-dependencies:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "04:30"
    open-pull-requests-limit: 5
    groups:
      container-images:
        patterns:
          - "*"
