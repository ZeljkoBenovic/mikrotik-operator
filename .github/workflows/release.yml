name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: zeljkobenovic/mikrotik-operator
  IMAGE_NAME_UI: zeljkobenovic/mikrotik-operator-ui

jobs:
  ci:
    name: Release quality gate
    uses: ./.github/workflows/ci.yml

  publish:
    name: Publish image and Helm chart
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Validate release tag
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
        run: |
          if [[ ! "$RELEASE_VERSION" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Release tag must match vMAJOR.MINOR.PATCH: $RELEASE_VERSION"
            exit 1
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image tags
        id: metadata
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=tag
            type=raw,value=latest

      - name: Publish image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Generate UI image tags
        id: metadata-ui
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_UI }}
          tags: |
            type=ref,event=tag
            type=raw,value=latest

      - name: Publish UI image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.ui
          push: true
          tags: ${{ steps.metadata-ui.outputs.tags }}
          labels: ${{ steps.metadata-ui.outputs.labels }}
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha,scope=mikrotik-operator-ui
          cache-to: type=gha,mode=max,scope=mikrotik-operator-ui

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Log in to Helm registry
        env:
          HELM_REGISTRY_USER: ${{ github.actor }}
          HELM_REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$HELM_REGISTRY_PASSWORD" | helm registry login ghcr.io --username "$HELM_REGISTRY_USER" --password-stdin

      - name: Publish chart
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
        run: |
          version="${RELEASE_VERSION#v}"
          helm package charts/mikrotik-operator \
            --version "$version" \
            --app-version "$RELEASE_VERSION"
          helm push "mikrotik-operator-${version}.tgz" oci://ghcr.io/zeljkobenovic/charts
