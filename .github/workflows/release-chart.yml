name: Release Helm chart

on:
  push:
    branches:
      - main
    paths:
      - 'charts/mikrotik-operator/**'
      - '.github/workflows/release-chart.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-chart
  cancel-in-progress: false

env:
  GO_VERSION: '1.27.x'
  KUBERNETES_VERSION: '1.37.0'

jobs:
  validate:
    name: Helm chart checks
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Go tooling
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Install kubeconform
        run: go install github.com/yannh/kubeconform/cmd/kubeconform@v0.6.7

      - name: Read chart version
        id: chart
        env:
          CHART_FILE: charts/mikrotik-operator/Chart.yaml
        run: |
          version="$(awk '/^version:/ { print $2; exit }' "$CHART_FILE")"
          app_version="$(awk '/^appVersion:/ { print $2; exit }' "$CHART_FILE")"
          if [[ ! "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Chart.yaml version must be MAJOR.MINOR.PATCH: $version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "app_version=$app_version" >> "$GITHUB_OUTPUT"
          echo "Chart version $version (appVersion $app_version)"

      - name: Lint chart
        run: |
          helm lint charts/mikrotik-operator
          helm lint charts/mikrotik-operator --set ui.enabled=true

      - name: Validate rendered built-in resources
        run: |
          helm template validation charts/mikrotik-operator --include-crds > rendered.yaml
          kubeconform \
            -strict \
            -summary \
            -ignore-missing-schemas \
            -kubernetes-version "${KUBERNETES_VERSION}" \
            rendered.yaml
          go run ./hack/uichart -ui=false rendered.yaml
          go run ./hack/uichart -ui=false -notes charts/mikrotik-operator/templates/NOTES.txt rendered.yaml

      - name: Validate rendered UI resources
        run: |
          helm template validation charts/mikrotik-operator --include-crds --set ui.enabled=true > rendered-ui.yaml
          kubeconform \
            -strict \
            -summary \
            -ignore-missing-schemas \
            -kubernetes-version "${KUBERNETES_VERSION}" \
            rendered-ui.yaml
          go run ./hack/uichart -ui=true rendered-ui.yaml
          go run ./hack/uichart -ui=true -notes charts/mikrotik-operator/templates/NOTES.txt rendered-ui.yaml
          helm template validation charts/mikrotik-operator --include-crds --set ui.enabled=true --set ui.rbac.create=false > rendered-ui-norbac.yaml
          go run ./hack/uichart -ui=true -rbac=false rendered-ui-norbac.yaml

      - name: Validate chart CRDs
        run: |
          go run ./hack/crdvalidate charts/mikrotik-operator/crds
          python3 skills/kubernetes-operator/scripts/crd_validator.py --crd charts/mikrotik-operator/crds

      - name: Verify Helm CRDs match config copies
        shell: bash
        run: |
          check_pair() {
            if ! cmp --silent "$1" "$2"; then
              echo "CRD copies differ: $1 != $2"
              return 1
            fi
          }
          check_pair config/crd/bases/mikrotik.operator.io_mikrotikdnsrecords.yaml charts/mikrotik-operator/crds/mikrotikdnsrecords.yaml
          check_pair config/crd/bases/mikrotik.operator.io_mikrotikfirewallrules.yaml charts/mikrotik-operator/crds/mikrotikfirewallrules.yaml
          check_pair config/crd/bases/mikrotik.operator.io_mikrotikportforwards.yaml charts/mikrotik-operator/crds/mikrotikportforwards.yaml
          check_pair config/crd/bases/mikrotik.operator.io_mikrotikrouters.yaml charts/mikrotik-operator/crds/mikrotikrouters.yaml
          check_pair config/crd/bases/mikrotik.operator.io_mikrotikroutes.yaml charts/mikrotik-operator/crds/mikrotikroutes.yaml

      - name: Package chart
        env:
          CHART_VERSION: ${{ steps.chart.outputs.version }}
        run: |
          helm package charts/mikrotik-operator
          test -f "mikrotik-operator-${CHART_VERSION}.tgz"

  publish:
    name: Publish Helm chart
    needs: validate
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Read chart version
        id: chart
        env:
          CHART_FILE: charts/mikrotik-operator/Chart.yaml
        run: |
          version="$(awk '/^version:/ { print $2; exit }' "$CHART_FILE")"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Log in to Helm registry
        env:
          HELM_REGISTRY_USER: ${{ github.actor }}
          HELM_REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$HELM_REGISTRY_PASSWORD" | helm registry login ghcr.io --username "$HELM_REGISTRY_USER" --password-stdin

      - name: Publish chart
        env:
          CHART_VERSION: ${{ steps.chart.outputs.version }}
        run: |
          chart_ref="oci://ghcr.io/zeljkobenovic/charts/mikrotik-operator"
          if helm show chart "$chart_ref" --version "$CHART_VERSION" >/dev/null 2>&1; then
            echo "Chart version $CHART_VERSION already exists at $chart_ref; skipping"
            exit 0
          fi
          helm package charts/mikrotik-operator
          helm push "mikrotik-operator-${CHART_VERSION}.tgz" oci://ghcr.io/zeljkobenovic/charts
