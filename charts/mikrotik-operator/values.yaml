replicaCount: 2

image:
  repository: ghcr.io/zeljkobenovic/mikrotik-operator
  tag: ""
  digest: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  automount: true
  annotations: {}
  name: ""

rbac:
  create: true

leaderElection:
  enabled: true

gatewayAPI:
  enabled: false
  gatewayClass:
    create: false
    name: mikrotik
    controller: mikrotik.operator.io/controller

metrics:
  bindAddress: ":8080"

healthProbe:
  bindAddress: ":8081"

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 500m
    memory: 256Mi

podAnnotations: {}
podLabels: {}
nodeSelector: {}
tolerations: []
affinity: {}

podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
    - ALL

service:
  metrics:
    enabled: true
    port: 8080

podDisruptionBudget:
  enabled: true
  minAvailable: 1

# Optional admin UI. It has no authentication; enable only on a trusted
# network or behind an authenticating proxy.
ui:
  enabled: false
  replicaCount: 1
  image:
    repository: ghcr.io/zeljkobenovic/mikrotik-operator-ui
    tag: ""
    digest: ""
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 8080
  resources:
    requests:
      cpu: 25m
      memory: 32Mi
    limits:
      cpu: 200m
      memory: 128Mi
  rbac:
    create: true

# Backup and restore CRs are always reconciled when present. There is no Helm
# flag for them. See docs/backup-restore.md. spec.remote.enabled must stay
# false until remote FTP/SMB/S3 storage is implemented.
