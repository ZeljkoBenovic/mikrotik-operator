{{- if .Values.ui.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "mikrotik-operator.ui.fullname" . }}
  labels:
    {{- include "mikrotik-operator.ui.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.ui.replicaCount }}
  selector:
    matchLabels:
      {{- include "mikrotik-operator.ui.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "mikrotik-operator.ui.labels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "mikrotik-operator.ui.serviceAccountName" . }}
      automountServiceAccountToken: true
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
      - name: ui
        image: {{ .Values.ui.image.repository }}{{ if .Values.ui.image.digest }}@{{ .Values.ui.image.digest }}{{ else }}:{{ default .Chart.AppVersion .Values.ui.image.tag }}{{ end }}
        imagePullPolicy: {{ .Values.ui.image.pullPolicy }}
        args:
        - "-bind-address=:{{ .Values.ui.service.port }}"
        - "-static-dir=/ui"
        securityContext:
          {{- toYaml .Values.containerSecurityContext | nindent 10 }}
        ports:
        - name: http
          containerPort: {{ .Values.ui.service.port }}
          protocol: TCP
        readinessProbe:
          httpGet:
            path: /readyz
            port: http
        livenessProbe:
          httpGet:
            path: /healthz
            port: http
        resources:
          {{- toYaml .Values.ui.resources | nindent 10 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
