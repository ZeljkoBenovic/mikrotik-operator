{{- if and .Values.gatewayAPI.enabled .Values.gatewayAPI.gatewayClass.create }}
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: {{ .Values.gatewayAPI.gatewayClass.name }}
  labels:
    {{- include "mikrotik-operator.labels" . | nindent 4 }}
spec:
  controllerName: {{ .Values.gatewayAPI.gatewayClass.controller }}
{{- end }}
